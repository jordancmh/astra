spring:
  ai:
    mcp:
      server:
        enabled: true
        name: astra-mcp-server
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/astra_db}
    username: astra_user
    password: astra_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

graphhopper:
  base-url: ${GRAPHHOPPER_URL:http://localhost:8989}
  timeout-ms: ${GRAPHHOPPER_TIMEOUT_MS:5000}
